[project]
name = "agentic-rag"
version = "0.1.0"
description = "Agentic retrieval-augmented generation API with cited answers."
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.1",
    "ddgs>=9.16.1",
    "fastapi>=0.165.0",
    "httpx>=0.28.1",
    "langchain-text-splitters>=1.2.0",
    "langgraph>=1.2.24",
    "pgvector>=0.5.1",
    "psycopg[binary]>=3.3.9",
    "pydantic-settings>=2.16.3",
    "pypdf>=7.1.1",
    "sentence-transformers>=6.3.0",
    "sqlalchemy[asyncio]>=2.1.9",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

# Linux (CI, servers) gets CPU-only PyTorch: the default Linux wheels bundle ~2.5 GB of CUDA
# libraries we never use. macOS keeps the standard wheels, which include Apple MPS support.
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.13.10,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "langchain-ollama>=1.2.0",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "ragas>=0.4.4",
    "ruff>=0.17.6",
]

# ---------------------------------------------------------------- tooling

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # isort
    "B",        # bugbear
    "UP",       # pyupgrade
    "SIM",      # simplify
    "ASYNC",    # async pitfalls
    "RUF",      # ruff-specific
    "PT",       # pytest style
]

[tool.ruff.lint.per-file-ignores]
"migrations/**" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["agentic_rag"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pgvector.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs the docker compose stack (Postgres)",
    "ollama: also needs Ollama and the models running (not available in CI)",
]
addopts = "-ra --strict-markers"
